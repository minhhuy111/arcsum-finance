<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArcSum Finance</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <nav class="fixed top-0 w-full bg-zinc-900 p-6 border-b border-zinc-700">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 class="text-3xl font-bold text-emerald-400">ArcSum Finance</h1>
      <button onclick="connectWallet()" id="connectBtn" 
              class="bg-emerald-500 hover:bg-emerald-600 px-8 py-3 rounded-2xl font-bold">
        Connect Wallet
      </button>
    </div>
  </nav>

  <div class="max-w-md mx-auto pt-40 px-6 text-center">
    <h2 class="text-3xl font-bold mb-6">Swap USDC → ARC</h2>
    
    <div id="status" class="mb-8 text-red-400">Chưa kết nối ví</div>
    
    <button onclick="performSwap()" 
            class="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-bold py-6 rounded-2xl text-xl">
      Swap Now (Thật)
    </button>
  </div>

<script>
let userAddress = null;

async function connectWallet() {
  if (!window.ethereum) {
    return alert("Vui lòng cài MetaMask!");
  }

  try {
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    userAddress = accounts[0];

    document.getElementById("connectBtn").innerHTML = `${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
    document.getElementById("connectBtn").style.backgroundColor = "#10b981";
    document.getElementById("status").innerHTML = "✅ Đã kết nối ví";
    document.getElementById("status").className = "mb-8 text-emerald-400";

    alert("✅ Kết nối thành công!\n" + userAddress);
  } catch (e) {
    alert("Lỗi: " + e.message);
  }
}

async function performSwap() {
  if (!userAddress) {
    return alert("Bạn chưa kết nối ví! Nhấn nút Connect Wallet trước.");
  }
  alert("✅ Đang gọi contract thật...\n(Approve ARC token)");
  // Sau này sẽ thêm code contract đầy đủ
}

console.log("🚀 Page loaded");
</script>
</body>
</html>
