<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArcSum Finance</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white">

  <div class="min-h-screen flex items-center justify-center">
    <div class="text-center">
      <h1 class="text-5xl font-bold mb-8 text-emerald-400">ArcSum Finance</h1>
      
      <button onclick="connectWallet()" 
              id="connectBtn"
              class="bg-emerald-500 hover:bg-emerald-600 text-black font-bold text-xl px-12 py-6 rounded-3xl">
        Connect Wallet
      </button>

      <p class="mt-8 text-zinc-400" id="status">Click nút Connect Wallet để test</p>
    </div>
  </div>

<script>
console.log("🚀 Script đã load");

async function connectWallet() {
  console.log("🔘 Nút Connect được click!");

  if (!window.ethereum) {
    alert("❌ MetaMask chưa cài hoặc chưa mở!");
    return;
  }

  try {
    const accounts = await window.ethereum.request({ 
      method: 'eth_requestAccounts' 
    });

    const address = accounts[0];
    
    document.getElementById("connectBtn").innerHTML = 
      `${address.slice(0,6)}...${address.slice(-4)}`;
    
    document.getElementById("connectBtn").style.backgroundColor = "#10b981";
    
    document.getElementById("status").innerHTML = `✅ Đã kết nối!<br>${address}`;
    
    alert("✅ Kết nối thành công!\n\n" + address);

  } catch (error) {
    console.error(error);
    alert("Lỗi: " + error.message);
  }
}

// Debug
window.onload = () => {
  console.log("📄 Trang web đã load xong");
};
</script>
</body>
</html>
