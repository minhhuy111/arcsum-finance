<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArcSum Finance - DEX on Arc</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <!-- Navbar -->
  <nav class="fixed top-0 w-full bg-zinc-900/95 backdrop-blur-md border-b border-zinc-700 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <h1 class="text-3xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">ArcSum</h1>
        <span class="text-xs px-3 py-1 bg-emerald-500/10 text-emerald-400 rounded-full">.finance</span>
      </div>
      
      <div class="flex items-center gap-8 text-sm font-medium">
        <a href="#" onclick="showSection('dashboard')" class="hover:text-emerald-400">Dashboard</a>
        <a href="#" onclick="showSection('swap')" class="hover:text-emerald-400">Swap</a>
        <a href="#" onclick="showSection('liquidity')" class="hover:text-emerald-400">Liquidity</a>
        <a href="#" onclick="showSection('nft')" class="hover:text-emerald-400">NFT</a>
        <a href="#" onclick="showSection('faucet')" class="hover:text-emerald-400">Faucet</a>
      </div>

      <div class="flex items-center gap-4">
        <button onclick="addArcNetwork()" class="bg-zinc-800 hover:bg-zinc-700 px-5 py-2.5 rounded-2xl text-sm transition">Add Network</button>
        <button onclick="connectWallet()" id="connectBtn" class="bg-emerald-500 hover:bg-emerald-600 px-6 py-2.5 rounded-2xl font-semibold transition">Connect Wallet</button>
      </div>
    </div>
  </nav>

  <div class="max-w-5xl mx-auto px-6 pt-28">
    <div id="dashboard-section" class="bg-zinc-900 rounded-3xl p-8">
      <h2 class="text-3xl font-bold mb-8">Portfolio</h2>
      <div id="portfolio" class="grid grid-cols-3 gap-6"></div>
    </div>
  </div>

<script>
const ARC_CHAIN_ID = '0x4cef52';
let userAddress = null;

async function connectWallet() {
  if (!window.ethereum) return alert("Vui lòng cài MetaMask!");

  try {
    try {
      await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: ARC_CHAIN_ID }] });
    } catch (e) {
      if (e.code === 4902) await addArcNetwork();
      else throw e;
    }

    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    userAddress = accounts[0];

    const btn = document.getElementById("connectBtn");
    btn.textContent = `${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
    btn.style.backgroundColor = "#10b981";

    alert(`✅ Kết nối thành công!\n\n${userAddress}`);
    loadPortfolio();
  } catch (error) {
    alert("Lỗi: " + (error.message || error));
  }
}

async function addArcNetwork() {
  try {
    await window.ethereum.request({
      method: 'wallet_addEthereumChain',
      params: [{
        chainId: ARC_CHAIN_ID,
        chainName: 'Arc Testnet',
        nativeCurrency: { name: 'USDC', symbol: 'USDC', decimals: 18 },
        rpcUrls: ['https://rpc.testnet.arc.network']
      }]
    });
    alert("✅ Đã thêm mạng Arc Testnet!");
  } catch (e) {
    alert("Không thể thêm mạng tự động.");
  }
}

function loadPortfolio() {
  document.getElementById("portfolio").innerHTML = `
    <div class="bg-zinc-800 rounded-2xl p-6">
      <p class="text-zinc-400">USDC</p>
      <p class="text-4xl font-bold text-emerald-400">1,234.56</p>
    </div>
    <div class="bg-zinc-800 rounded-2xl p-6">
      <p class="text-zinc-400">ARC</p>
      <p class="text-4xl font-bold text-emerald-400">5,678.90</p>
    </div>
  `;
}

function showSection(section) {
  alert("Chuyển sang tab: " + section + " (đang phát triển)");
}

console.log("🚀 ArcSum Finance loaded successfully!");
</script>
</body>
</html>
