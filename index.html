<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArcSum Finance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.min.js"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

<nav class="fixed top-0 w-full bg-zinc-900 p-6">
  <div class="max-w-7xl mx-auto flex justify-between">
    <h1 class="text-3xl font-bold text-emerald-400">ArcSum Finance</h1>
    <button onclick="connectWallet()" id="connectBtn" class="bg-emerald-500 px-8 py-3 rounded-2xl font-bold">
      Connect Wallet
    </button>
  </div>
</nav>

<div class="max-w-md mx-auto pt-32 px-6">
  <h2 class="text-3xl font-bold text-center mb-8">Swap USDC → ARC</h2>
  
  <div class="bg-zinc-900 rounded-3xl p-8">
    <button onclick="performSwap()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-bold py-6 rounded-2xl text-xl">
      Swap Now (Gọi Contract Thật)
    </button>
  </div>
</div>

<script>
const ARC_TOKEN = "0x343D87e36171f47F499065b1e12CC8E583CD831c";
let signer = null;
let userAddress = null;

async function connectWallet() {
  if (!window.ethereum) return alert("Cài MetaMask!");

  const provider = new ethers.BrowserProvider(window.ethereum);
  signer = await provider.getSigner();
  userAddress = await signer.getAddress();

  document.getElementById("connectBtn").innerHTML = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
  alert("✅ Kết nối thành công!");
}

async function performSwap() {
  if (!signer) return alert("Chưa kết nối ví!");

  try {
    alert("🔄 Đang approve ARC token...");

    const abi = [
      "function approve(address spender, uint256 amount) public returns (bool)"
    ];

    const contract = new ethers.Contract(ARC_TOKEN, abi, signer);
    
    // Approve 1000 ARC cho ví (bạn có thể thay địa chỉ spender sau)
    const tx = await contract.approve(userAddress, ethers.parseUnits("1000", 18));
    await tx.wait();

    alert("✅ Approve thành công!\nBạn có thể swap sau khi có Router.");
    
  } catch (error) {
    console.error(error);
    alert("Lỗi: " + error.message);
  }
}
</script>
</body>
</html>
