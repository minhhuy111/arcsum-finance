<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArcSum Finance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.min.js"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <nav class="fixed top-0 w-full bg-zinc-900 p-6">
    <div class="max-w-7xl mx-auto flex justify-between">
      <h1 class="text-3xl font-bold text-emerald-400">ArcSum Finance</h1>
      <button onclick="connectWallet()" id="connectBtn" class="bg-emerald-500 px-8 py-3 rounded-2xl font-bold">
        Connect Wallet
      </button>
    </div>
  </nav>

  <div class="max-w-md mx-auto pt-32 px-6">
    <h2 class="text-3xl font-bold text-center mb-8">Swap USDC → ARC</h2>
    
    <div id="status" class="mb-8 text-center text-red-400">Chưa kết nối</div>
    
    <button onclick="approveToken()" 
            class="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-bold py-6 rounded-2xl text-xl mb-4">
      Approve ARC Token (Gọi Ví Thật)
    </button>
  </div>

<script>
let signer = null;
let userAddress = null;
const ARC_TOKEN = "0x343D87e36171f47F499065b1e12CC8E583CD831c";

async function connectWallet() {
  if (!window.ethereum) return alert("Cài MetaMask!");

  const provider = new ethers.BrowserProvider(window.ethereum);
  signer = await provider.getSigner();
  userAddress = await signer.getAddress();

  document.getElementById("connectBtn").innerHTML = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
  document.getElementById("status").innerHTML = "✅ Đã kết nối";
  document.getElementById("status").className = "mb-8 text-center text-emerald-400";
  
  alert("✅ Kết nối thành công!");
}

async function approveToken() {
  if (!signer) return alert("Chưa kết nối ví!");

  try {
    const abi = ["function approve(address spender, uint256 amount) public returns (bool)"];
    const contract = new ethers.Contract(ARC_TOKEN, abi, signer);

    const amount = ethers.parseUnits("1000", 18); // 1000 ARC

    alert("MetaMask sẽ hiện popup xác nhận Approve...");

    const tx = await contract.approve(userAddress, amount);
    await tx.wait();

    alert("✅ Approve thành công! MetaMask đã xác nhận.");
  } catch (error) {
    alert("Transaction bị hủy hoặc lỗi: " + error.message);
  }
}
</script>
</body>
</html>
