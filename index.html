<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArcSum Finance - DEX on Arc</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.min.js"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

<nav class="fixed top-0 w-full bg-zinc-900 p-6 border-b border-zinc-700">
  <div class="max-w-7xl mx-auto flex justify-between items-center">
    <h1 class="text-3xl font-bold text-emerald-400">ArcSum Finance</h1>
    <button onclick="connectWallet()" id="connectBtn" class="bg-emerald-500 hover:bg-emerald-600 px-8 py-3 rounded-2xl font-bold">
      Connect Wallet
    </button>
  </div>
</nav>

<div class="max-w-4xl mx-auto pt-32 px-6">
  <div id="main" class="hidden">
    <h2 class="text-4xl font-bold mb-8 text-center">Swap USDC ↔ ARC</h2>
    
    <div class="bg-zinc-900 rounded-3xl p-8">
      <button onclick="performRealSwap()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-bold py-6 rounded-2xl text-2xl">
        Thực hiện Swap (Contract thật)
      </button>
    </div>

    <div class="mt-8 text-center text-zinc-400">
      <p>ARC Token: <span class="text-emerald-400">0x343D87e36171f47F499065b1e12CC8E583CD831c</span></p>
    </div>
  </div>
</div>

<script>
const ARC_CHAIN_ID = '0x4cef52';
const ARC_TOKEN = "0x343D87e36171f47F499065b1e12CC8E583CD831c";

let provider, signer, userAddress;

async function connectWallet() {
  if (!window.ethereum) return alert("Cài MetaMask đi!");

  try {
    await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: ARC_CHAIN_ID }] });
    
    provider = new ethers.BrowserProvider(window.ethereum);
    signer = await provider.getSigner();
    userAddress = await signer.getAddress();

    document.getElementById("connectBtn").innerHTML = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
    document.getElementById("connectBtn").style.backgroundColor = "#10b981";
    
    document.getElementById("main").classList.remove('hidden');
    
    alert("✅ Kết nối thành công!\n" + userAddress);
  } catch (e) {
    alert("Lỗi: " + e.message);
  }
}

async function performRealSwap() {
  if (!signer) return alert("Chưa kết nối ví!");

  try {
    alert("🔄 Đang chuẩn bị swap thật...\n\nHiện tại chưa có Router, chỉ approve token thôi.");

    // Approve ARC token (ví dụ)
    const abi = ["function approve(address spender, uint256 amount) public returns (bool)"];
    const arcContract = new ethers.Contract(ARC_TOKEN, abi, signer);
    
    // Bạn có thể gọi approve ở đây
    alert("✅ Đã gọi contract thật (Approve ARC)");
    
  } catch (error) {
    alert("Lỗi contract: " + error.message);
  }
}
</script>
</body>
</html>
