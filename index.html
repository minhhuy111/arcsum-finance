<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArcSum Finance</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <nav class="fixed top-0 w-full bg-zinc-900 p-6 border-b border-zinc-700">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 class="text-3xl font-bold text-emerald-400">ArcSum Finance</h1>
      <button onclick="connectWallet()" id="connectBtn" 
              class="bg-emerald-500 hover:bg-emerald-600 px-8 py-3 rounded-2xl font-bold">
        Connect Wallet
      </button>
    </div>
  </nav>

  <div class="max-w-md mx-auto pt-40 px-6 text-center">
    <h2 class="text-4xl font-bold mb-8">Swap USDC → ARC</h2>
    
    <div id="status" class="mb-8 text-red-400 text-xl">Chưa kết nối ví</div>
    
    <button onclick="performSwap()" 
            class="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-bold py-6 rounded-2xl text-xl">
      Swap Now (Thật)
    </button>
  </div>

<script>
async function connectWallet() {
  if (!window.ethereum) {
    return alert("❌ Vui lòng cài MetaMask!");
  }

  try {
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    const address = accounts[0];

    document.getElementById("connectBtn").innerHTML = `${address.slice(0,6)}...${address.slice(-4)}`;
    document.getElementById("connectBtn").style.backgroundColor = "#10b981";
    
    document.getElementById("status").innerHTML = "✅ Đã kết nối ví";
    document.getElementById("status").className = "mb-8 text-emerald-400 text-xl";

    alert("✅ Kết nối thành công!\n" + address);
  } catch (error) {
    alert("Lỗi: " + error.message);
  }
}

async function performSwap() {
  if (!window.ethereum) return alert("Chưa kết nối ví!");

  try {
    alert("MetaMask sẽ hiện popup Approve ARC token...\nHãy xác nhận trong MetaMask");
    
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    
    // Gọi approve thật
    await window.ethereum.request({
      method: 'wallet_sendTransaction',
      params: [{
        from: accounts[0],
        to: "0x343D87e36171f47F499065b1e12CC8E583CD831c",
        data: "0x095ea7b3" + "000000000000000000000000" + accounts[0].slice(2) + "00000000000000000000000000000000000000000000000000000000000003e8"
      }]
    });

    alert("✅ Transaction đã gửi! Kiểm tra MetaMask.");
  } catch (error) {
    alert("Transaction bị hủy hoặc lỗi.");
  }
}
</script>
</body>
</html>
